# Fly.io, Sydney. Balances are read from Basiq on demand and never stored,
# but everything that is stored (users, sessions, the audit log) stays onshore.
app = "cashstack-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once per deploy, before any new machine takes traffic.
  release_command = "node src/migrate.ts"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  BASIQ_MODE = "live"
  PUBLIC_URL = "https://cashstack-api.fly.dev"
  APP_BUNDLE_ID = "com.bokscot.cashstack"
  APP_CALLBACK_SCHEME = "cashstack"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
